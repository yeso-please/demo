# 이 파일을 application-secret.yaml로 복사한 뒤 실제 키를 입력하세요.
# application-secret.yaml은 .gitignore 대상입니다.
tour:
  api:
    key: YOUR_TOUR_API_KEY

gemini:
  api:
    key: YOUR_GEMINI_API_KEY

kakao:
  js:
    key: YOUR_KAKAO_JAVASCRIPT_KEY
  mobility:
    rest-api-key: YOUR_KAKAO_REST_API_KEY

# /admin/** 호출을 막는 토큰. 로컬에서 admin 엔드포인트를 테스트하려면 채운다.
# (비워두면 로컬에서는 검사를 건너뛴다 — 배포 환경에서만 필수)
admin:
  token: YOUR_ADMIN_TOKEN
