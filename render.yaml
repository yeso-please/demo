services:
  - type: web
    name: hidden-travel
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # 값은 Render 대시보드에서 직접 입력 (여기엔 값을 넣지 않는다).
      # Spring relaxed binding: TOUR_API_KEY -> tour.api.key,
      # KAKAO_MOBILITY_REST_API_KEY -> kakao.mobility.rest-api-key
      - key: TOUR_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: KAKAO_JS_KEY
        sync: false
      - key: KAKAO_MOBILITY_REST_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # H2 콘솔은 배포 환경에서 반드시 꺼야 한다 (전체 DB가 웹에 노출됨).
      - key: H2_CONSOLE_ENABLED
        value: "false"
