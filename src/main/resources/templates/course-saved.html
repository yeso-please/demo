<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sumeun · 코스 저장 완료')}"></head>
<body class="bg-background min-h-screen text-text-primary antialiased flex flex-col">
<!-- 트랜잭션 화면: 공통 네비게이션 미사용 (지침 6) -->
<main class="flex-grow flex items-center justify-center py-section-gap px-4">
    <div class="w-full max-w-[640px] mx-auto flex flex-col items-center gap-10">
        <!-- Header Section -->
        <div class="flex flex-col items-center text-center gap-6">
            <!-- Animated Checkmark Icon -->
            <div class="w-16 h-16 rounded-full border border-sage flex items-center justify-center bg-sage-bg">
                <svg class="w-8 h-8 text-sage" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24">
                    <path class="animate-check" d="M20 6L9 17l-5-5"></path>
                </svg>
            </div>
            <h1 class="font-display-title-mobile text-display-title-mobile text-text-primary">코스가 저장되었어요</h1>
        </div>

        <!-- Course Summary Card -->
        <div class="w-full bg-surface border border-border animate-fade-up overflow-hidden">
            <div class="p-card-padding flex flex-col gap-8">
                <!-- Course Title & Region -->
                <div class="flex flex-col gap-1">
                    <div class="font-caption text-caption text-text-muted" th:text="${regionLabel}">경상북도 안동시</div>
                    <h2 class="font-section-title text-section-title text-text-primary" th:text="${course.title}">코스명</h2>
                </div>
                <!-- 3-Column Stats (소요시간·이동거리는 동선 계산 전이라 미표시) -->
                <div class="grid grid-cols-3 gap-4 border-t border-border pt-6">
                    <div class="flex flex-col gap-1">
                        <span class="font-caption text-caption text-text-muted">총 장소</span>
                        <span class="font-card-title text-card-title text-text-primary" th:text="${course.stopCount()} + '곳'">4곳</span>
                    </div>
                    <!-- 저장된 값이 있으면 바로, 없으면 course-map.js 가 길찾기 결과로 채운다 -->
                    <div class="flex flex-col gap-1">
                        <span class="font-caption text-caption text-text-muted">예상 소요시간</span>
                        <span id="route-duration" class="font-card-title text-card-title text-text-primary"
                              th:text="${course.durationText() != null ? course.durationText() : '계산 중…'}">-</span>
                    </div>
                    <div class="flex flex-col gap-1">
                        <span class="font-caption text-caption text-text-muted">이동 거리</span>
                        <span id="route-distance" class="font-card-title text-card-title text-text-primary"
                              th:text="${course.distanceText() != null ? course.distanceText() : '계산 중…'}">-</span>
                    </div>
                </div>
                <!-- 경유지 -->
                <div th:if="${!stopNames.isEmpty()}" class="border-t border-border pt-6 flex flex-wrap gap-2">
                    <span th:each="name : ${stopNames}" class="chip" th:text="${name}">지점</span>
                </div>

                <!-- 동선 지도 — 저장할 때 함께 담아둔 좌표로 그린다 -->
                <div th:if="${!mapStops.isEmpty()}" class="border-t border-border pt-6">
                    <div class="relative h-[260px] rounded-lg overflow-hidden border border-border bg-surface-alt">
                        <!-- data-course-id 가 있으면 course-map.js 가 실제 도로 경로를 가져온다 -->
                        <div id="course-map" class="absolute inset-0" th:attr="data-course-id=${course.id}"></div>
                        <div th:if="${kakaoJsKey == null or kakaoJsKey.isBlank()}"
                             class="absolute inset-0 flex flex-col items-center justify-center gap-1 text-center px-4 bg-surface-alt z-10">
                            <span class="material-symbols-outlined text-text-muted text-[28px]">key_off</span>
                            <span class="font-caption text-caption text-text-muted">
                                카카오맵 키를 넣으면 동선이 표시됩니다<br/>
                                <code class="text-[11px]">config/application-secret.yaml → kakao.js.key</code>
                            </span>
                        </div>
                    </div>
                    <p id="route-note" class="font-caption text-caption text-text-muted mt-1.5">
                        경로를 계산하는 중이에요…
                    </p>
                    <!-- course-map.js 가 읽어가는 좌표 (course 편집 화면과 같은 선택자) -->
                    <div id="course-timeline" class="hidden">
                        <div th:each="s : ${mapStops}" class="course-item"
                             th:attr="data-name=${s.name},data-lat=${s.lat},data-lng=${s.lng}"></div>
                    </div>
                </div>
            </div>
            <!-- Bottom Bar -->
            <div class="bg-sage-bg px-card-padding py-4 border-t border-border flex items-center gap-2">
                <span class="material-symbols-outlined text-sage text-[18px]">volunteer_activism</span>
                <span class="font-caption text-caption text-secondary">착한가격업소 <span th:text="${course.goodPriceCount}">2</span>곳 포함 · 지역 상권으로 가는 소비</span>
            </div>
        </div>

        <!-- 다녀온 뒤 다이어리를 쓰는 것이 다음 단계 — 그 글이 다음 추천을 바꾼다 -->
        <div class="w-full flex flex-col sm:flex-row gap-4 animate-fade-up" style="animation-delay: 0.4s;">
            <a th:href="@{/onboarding/visits(courseId=${course.id})}"
               class="flex-1 h-[44px] bg-primary-container text-on-primary font-card-title text-card-title flex items-center justify-center gap-2 hover:bg-accent-hover hover:-translate-y-[2px] transition-all duration-300">
                <span class="material-symbols-outlined text-[20px]">edit_note</span>
                다녀왔어요
            </a>
            <a th:href="@{/my/courses}" class="flex-1 h-[44px] bg-surface border border-border text-text-primary font-card-title text-card-title flex items-center justify-center hover:bg-surface-alt transition-colors duration-300">
                내 코스 보기
            </a>
            <a th:href="@{/map}" class="flex-1 h-[44px] bg-surface border border-border text-text-primary font-card-title text-card-title flex items-center justify-center hover:bg-surface-alt transition-colors duration-300">
                지도로 돌아가기
            </a>
        </div>

        <!-- Recommendations Section -->
        <div class="w-full mt-8 animate-fade-up flex flex-col gap-4" style="animation-delay: 0.5s;">
            <h3 class="font-body-main text-body-main text-text-muted text-left w-full">다음엔 어디로?</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <a th:each="reco : ${recommendations}" th:href="@{/region/panel}"
                   class="group bg-surface border border-border p-4 flex flex-col gap-4 hover:-translate-y-[2px] hover:border-outline transition-all duration-300 cursor-pointer">
                    <div class="flex flex-col gap-1">
                        <span class="font-caption text-caption text-text-muted" th:text="${reco.region}">지역</span>
                        <span class="font-card-title text-card-title text-text-primary" th:text="${reco.title}">코스명</span>
                    </div>
                    <div class="flex justify-between items-end mt-auto">
                        <span class="font-caption text-caption text-text-muted max-w-[80%] line-clamp-1" th:text="${reco.desc}">설명</span>
                        <span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">arrow_forward</span>
                    </div>
                </a>
            </div>
        </div>
    </div>
</main>

<!-- 카카오맵 SDK (키가 있을 때만 로드) -->
<script th:if="${kakaoJsKey != null and !kakaoJsKey.isBlank()}"
        th:src="'//dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=' + ${kakaoJsKey}"></script>
<script th:src="@{/js/course-map.js}"></script>
</body>
</html>
