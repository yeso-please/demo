<!DOCTYPE html>
<html class="light" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('여행페이지 · 초대장')}"></head>
<body class="bg-background text-text-primary font-body-main antialiased min-h-screen flex flex-col">

<main class="flex-1 w-full max-w-[560px] mx-auto px-4 py-8 flex flex-col">

    <!-- ===== 시작 화면 ===== -->
    <section id="mbti-intro" class="invite-landing" aria-labelledby="invite-title">
        <div class="ink-splash ink-splash--one" aria-hidden="true"></div>
        <div class="ink-splash ink-splash--two" aria-hidden="true"></div>
        <div class="invite-route" aria-hidden="true">
            <span class="invite-route__dot"></span>
            <span class="invite-route__line"></span>
            <span class="invite-route__dot invite-route__dot--end"></span>
        </div>

        <div class="invite-letter-flight" aria-label="편지가 도착하는 장면">
            <div class="invite-card">
            <div class="invite-card__topline">
                <span class="brand-wordmark">여행페이지 · 초대장</span>
                <span>01 / 12</span>
            </div>

            <div class="invite-card__seal" aria-hidden="true">
                <span th:replace="~{fragments/brand :: logoMark(48)}"></span>
            </div>

            <p class="invite-card__eyebrow">A SMALL INVITATION FOR YOU</p>
            <h1 id="invite-title" class="invite-card__title">당신의 취향에 맞는<br/><em>여행지에 초대합니다</em></h1>
            <div class="invite-card__rule" aria-hidden="true"></div>
            <p class="invite-card__copy">
                기억에 남은 여행을 한 편 적어주세요.<br/>
                지도에서 다녀온 지역을 고르고,<br/>
                그곳에서 느낀 결을 편지처럼 남겨주세요.
            </p>

            <div class="invite-card__signature">
                <span>당신의 다음 장면을 기다리며</span>
                <strong class="brand-wordmark">여행페이지 드림</strong>
            </div>

            <a th:href="@{/login}" class="invite-cta">
                <span>초대에 참여하기</span>
                <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
            </a>
            <p class="invite-card__hint">가입 없이 시작할 수 있어요 · 약 1분</p>
            </div>
        </div>

        <a th:href="@{/map}" class="invite-skip">편지는 나중에 열어볼게요 <span aria-hidden="true">↗</span></a>
    </section>

</main>

<style>
    /* 01 들어오기 — 잉크 번짐 위에 놓인 여행 초대장 */
    .invite-landing {
        position: relative;
        isolation: isolate;
        min-height: min(780px, calc(100vh - 64px));
        margin: -32px -16px -32px;
        padding: 56px 16px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 42%, rgba(65, 87, 124, .28), transparent 34%),
            linear-gradient(145deg, #0B1220 0%, var(--bg) 58%, #18253A 100%);
    }
    .ink-splash {
        position: absolute;
        z-index: -1;
        width: 410px;
        height: 410px;
        border-radius: 44% 56% 63% 37% / 39% 42% 58% 61%;
        opacity: .82;
        filter: blur(.2px);
        transform: rotate(-18deg);
        background:
            radial-gradient(circle at 38% 35%, rgba(243, 196, 119, .48) 0 2%, transparent 2.7%),
            radial-gradient(circle at 68% 18%, rgba(243, 196, 119, .22) 0 1.5%, transparent 2.3%),
            radial-gradient(ellipse at 42% 46%, #405574 0 22%, #263852 55%, transparent 72%);
    }
    .ink-splash::before,
    .ink-splash::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: #647FA6;
        opacity: .7;
    }
    .ink-splash::before { width: 20px; height: 20px; top: 4%; right: 19%; box-shadow: 48px 36px 0 -5px #405574, -36px 80px 0 -7px #708DB7; }
    .ink-splash::after { width: 10px; height: 10px; bottom: 14%; left: 8%; box-shadow: 28px 18px 0 2px #405574, 344px -20px 0 -2px #708DB7; }
    .ink-splash--one { top: 4%; left: -180px; }
    .ink-splash--two { right: -210px; bottom: 2%; transform: rotate(28deg) scale(.76); opacity: .52; }
    .invite-route { position: absolute; inset: 0; pointer-events: none; opacity: .5; }
    .invite-route__line { position: absolute; width: 180px; height: 90px; left: calc(50% + 160px); top: 23%; border-top: 1px dashed var(--accent); border-radius: 50%; transform: rotate(20deg); }
    .invite-route__dot { position: absolute; left: calc(50% + 155px); top: calc(23% - 4px); width: 8px; height: 8px; border: 2px solid var(--accent); border-radius: 50%; }
    .invite-route__dot--end { left: calc(50% + 320px); top: 30%; background: var(--accent); box-shadow: 0 0 18px var(--accent); }
    .invite-letter-flight {
        position: relative;
        width: min(100%, 440px);
        animation: letter-flight 1050ms cubic-bezier(.12,.78,.24,1) both;
        transform-origin: 50% 90%;
    }
    .invite-letter-flight::before {
        content: "";
        position: absolute;
        z-index: -1;
        left: -48px;
        top: 28px;
        width: 86px;
        height: 58px;
        border: 1px solid rgba(241, 205, 143, .6);
        border-radius: 4px;
        background: linear-gradient(145deg, #d8ad72, #9e673d);
        box-shadow: 0 12px 20px rgba(0,0,0,.25);
        transform: rotate(-24deg) scale(.82);
        opacity: 0;
        animation: envelope-sweep 1050ms cubic-bezier(.16,.84,.3,1) both;
    }
    .invite-letter-flight::after {
        content: "✦  ·  ·  ·";
        position: absolute;
        left: -82px;
        top: 18px;
        color: rgba(243, 196, 119, .76);
        font-size: 15px;
        letter-spacing: .35em;
        opacity: 0;
        transform: rotate(-17deg);
        animation: letter-trail 1050ms ease-out both;
    }
    .invite-card {
        position: relative;
        width: min(100%, 440px);
        padding: 26px 32px 24px;
        color: #3f2b20;
        text-align: center;
        background: #f1dfc2;
        border: 1px solid rgba(255, 244, 218, .75);
        box-shadow: 0 28px 70px rgba(0, 0, 0, .48), 0 2px 0 rgba(255,255,255,.2) inset;
        transform: rotate(-1.2deg);
        animation: letter-open 1050ms cubic-bezier(.16,.84,.3,1) both;
    }
    .invite-card::before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(125, 81, 43, .28); pointer-events: none; }
    .invite-card__topline { display: flex; justify-content: space-between; position: relative; color: #91602f; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .invite-card__seal { position: relative; display: grid; place-items: center; width: 66px; height: 66px; margin: 28px auto 14px; border-radius: 50%; background: #8d492a; box-shadow: 0 5px 12px rgba(83, 39, 19, .25); }
    .invite-card__seal .brand-mark { filter: brightness(1.65) saturate(.72); }
    .invite-card__eyebrow { position: relative; color: #9a5b12; font-size: 10px; font-weight: 700; letter-spacing: .2em; }
    .invite-card__title { position: relative; margin: 10px 0 15px; color: #291d18; font-family: var(--font-serif); font-size: clamp(28px, 7vw, 38px); font-weight: 700; line-height: 1.35; letter-spacing: -.06em; }
    .invite-card__title em { color: #a45728; font-style: normal; }
    .invite-card__rule { position: relative; width: 48px; height: 1px; margin: 0 auto 17px; background: #a56a31; }
    .invite-card__copy { position: relative; color: #715b4c; font-family: var(--font-serif); font-size: 14px; line-height: 1.85; }
    .invite-card__signature { position: relative; display: flex; flex-direction: column; gap: 2px; margin: 18px 0 22px; color: #896c58; font-family: var(--font-serif); font-size: 12px; text-align: right; }
    .invite-card__signature strong { color: #6b402a; font-size: 16px; }
    .invite-cta { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 52px; border: 0; border-radius: 3px; background: #2d211b; color: #f9e8c9; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 7px 0 #b36b35; transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease; }
    .invite-cta:hover { background: #452b1d; transform: translateY(-2px); box-shadow: 0 9px 0 #b36b35; }
    .invite-cta:active { transform: translateY(4px); box-shadow: 0 3px 0 #b36b35; }
    .invite-card__hint { position: relative; margin-top: 15px; color: #a08069; font-size: 11px; }
    .invite-skip { margin-top: 24px; color: rgba(245, 235, 221, .62); font-size: 12px; transition: color 180ms ease; }
    .invite-skip:hover { color: var(--accent); }
    @keyframes letter-flight {
        0% { opacity: 0; transform: translate(58vw, -46vh) rotate(18deg) scale(.36); }
        58% { opacity: 1; transform: translate(-18px, 10px) rotate(-7deg) scale(1.02); }
        76% { transform: translate(7px, -4px) rotate(2deg) scale(1); }
        100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    }
    @keyframes letter-open {
        0%, 48% { opacity: 0; transform: rotate(-8deg) scale(.78); filter: brightness(1.18); }
        72% { opacity: 1; transform: rotate(1.8deg) scale(1.015); }
        100% { opacity: 1; transform: rotate(-1.2deg) scale(1); filter: brightness(1); }
    }
    @keyframes envelope-sweep {
        0% { opacity: 0; transform: translate(34vw, -28vh) rotate(-48deg) scale(.35); }
        42% { opacity: .95; }
        78% { opacity: .45; transform: translate(14px, 4px) rotate(-24deg) scale(.82); }
        100% { opacity: 0; transform: translate(100px, 12px) rotate(-18deg) scale(.7); }
    }
    @keyframes letter-trail {
        0%, 18% { opacity: 0; transform: translate(28vw, -25vh) rotate(-17deg); }
        42% { opacity: .9; }
        76%, 100% { opacity: 0; transform: translate(30px, 6px) rotate(-17deg); }
    }
    @media (max-width: 560px) {
        .invite-landing { margin: -32px -16px -32px; padding: 34px 14px 30px; min-height: calc(100vh - 24px); }
        .invite-card { padding: 22px 24px 20px; }
        .invite-card__seal { margin-top: 22px; }
        .invite-route { opacity: .25; }
    }
    @media (prefers-reduced-motion: reduce) {
        .invite-letter-flight, .invite-letter-flight::before, .invite-letter-flight::after, .invite-card { animation: none; }
        .invite-cta { transition: none; }
    }

</style>
</body>
</html>
