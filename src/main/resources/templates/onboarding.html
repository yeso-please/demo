<!DOCTYPE html>
<html class="light" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sumeun · 여행 MBTI')}"></head>
<body class="bg-background text-text-primary font-body-main antialiased min-h-screen flex flex-col">

<main class="flex-1 w-full max-w-[560px] mx-auto px-4 py-8 flex flex-col">

    <!-- ===== 시작 화면 ===== -->
    <section id="mbti-intro" class="flex-1 flex flex-col items-center justify-center text-center gap-5">
        <span th:replace="~{fragments/brand :: logoMark(64)}"></span>
        <div>
            <h1 class="font-display-title text-display-title text-text-primary mb-2">나의 여행 MBTI</h1>
            <p class="font-body-main text-body-main text-text-muted leading-relaxed">
                12개 질문으로 알아보는 나의 여행 성향.<br/>
                결과에 맞춰 어울리는 여행지를 추천해 드려요.
            </p>
        </div>
        <div class="flex items-center gap-1.5 font-caption text-caption text-text-muted">
            <span class="material-symbols-outlined text-[16px]">schedule</span>
            <span>1분이면 끝나요</span>
        </div>
        <button type="button" id="mbti-start" class="btn-primary w-full h-[52px] text-card-title mt-2">
            <span class="material-symbols-outlined text-[22px]">explore</span>
            검사 시작하기
        </button>
        <a th:href="@{/map}" class="font-caption text-caption text-text-muted hover:text-primary transition-colors">
            나중에 할게요
        </a>
    </section>

    <!-- ===== 문항 ===== -->
    <section id="mbti-quiz" class="hidden flex-1 flex-col">
        <!-- 진행률 -->
        <div class="mb-6">
            <div class="flex items-baseline justify-between mb-2">
                <span class="font-caption text-caption text-primary font-semibold">
                    <span id="mbti-current">1</span> / <span th:text="${questions.size()}">12</span>
                </span>
                <button type="button" id="mbti-back"
                        class="font-caption text-caption text-text-muted hover:text-primary transition-colors inline-flex items-center gap-1">
                    <span class="material-symbols-outlined text-[16px]">arrow_back</span>이전
                </button>
            </div>
            <div class="h-2 bg-surface-alt rounded-full overflow-hidden">
                <div id="mbti-bar" class="h-full bg-primary rounded-full transition-all duration-300" style="width:8%"></div>
            </div>
        </div>

        <!-- 문항 카드 (한 번에 하나만 보인다) -->
        <div th:each="q, it : ${questions}" class="mbti-q flex-1 flex-col justify-center"
             th:classappend="${it.index > 0} ? 'hidden' : 'flex'" th:attr="data-index=${it.index}">
            <p class="font-caption text-caption text-text-muted mb-2"
               th:text="'Q ' + (${q.number} < 10 ? '0' : '') + ${q.number}">Q 01</p>
            <h2 class="font-section-title text-section-title text-text-primary leading-snug mb-6"
                th:text="${q.question}">질문</h2>

            <div class="flex flex-col gap-3">
                <button type="button" class="mbti-a" data-pick="1" th:text="${q.answer1}">답변 1</button>
                <button type="button" class="mbti-a" data-pick="2" th:text="${q.answer2}">답변 2</button>
            </div>
        </div>
    </section>

    <!-- ===== 결과 ===== -->
    <section id="mbti-result" class="hidden flex-1 flex-col items-center justify-center text-center gap-4">
        <div id="mbti-emoji" class="text-[72px] leading-none">🎈</div>
        <div>
            <p id="mbti-code" class="font-caption text-caption text-primary font-semibold tracking-[0.2em] mb-1">ENFP</p>
            <h1 id="mbti-label" class="font-display-title text-display-title text-text-primary mb-2">우연을 사랑하는 방랑자</h1>
            <p id="mbti-tagline" class="font-body-main text-body-main text-text-muted">계획에 없던 발견을 반기는 타입</p>
        </div>

        <div class="w-full bg-surface border-2 border-border rounded-xl p-card-padding shadow-sm text-left">
            <p class="font-caption text-caption text-text-muted mb-1">이런 여행이 어울려요</p>
            <p id="mbti-style" class="font-body-main text-body-main text-text-primary">추천 성향</p>
        </div>

        <!-- 비로그인 안내 -->
        <div id="mbti-signup-note" class="hidden w-full bg-sage-bg border-2 border-sage rounded-xl p-4 text-left">
            <p class="font-caption text-caption text-text-primary">
                가입하면 결과가 프로필에 저장되고, AI 상담이 성향에 맞춰 추천해 드려요.
            </p>
        </div>

        <div class="w-full flex flex-col sm:flex-row gap-3 mt-2">
            <a th:href="@{/map}" class="btn-primary flex-1 h-[52px]">
                <span class="material-symbols-outlined text-[20px]">map</span>
                여행지 보러 가기
            </a>
            <a th:if="${!loggedIn}" th:href="@{/signup}" class="btn-secondary flex-1 h-[52px]">가입하고 저장</a>
            <button type="button" id="mbti-retry" class="btn-secondary flex-1 h-[52px]">다시 하기</button>
        </div>
    </section>

</main>

<style>
    /* 선택지 — 크고 둥글게, 누르면 통통 */
    .mbti-a {
        width: 100%;
        min-height: 68px;
        padding: 16px 20px;
        background: var(--surface);
        border: 2px solid var(--border);
        border-radius: var(--radius-card);
        font-size: var(--fs-body);
        line-height: 1.5;
        text-align: left;
        color: var(--text);
        cursor: pointer;
        transition: transform 150ms ease-out, border-color var(--transition), background var(--transition);
    }
    .mbti-a:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
        transform: translateY(-2px);
    }
    .mbti-a:active { transform: scale(0.98); }
    /* 고른 순간 잠깐 강조됐다가 다음 문항으로 넘어간다 */
    .mbti-a.picked {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--on-accent);
        transform: scale(1.02);
    }
    /* 문항이 바뀔 때 살짝 떠오르는 느낌 */
    .mbti-q:not(.hidden) { animation: mbtiIn 280ms ease-out; }
    @keyframes mbtiIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    #mbti-emoji { animation: mbtiPop 500ms ease-out; }
    @keyframes mbtiPop {
        0%   { opacity: 0; transform: scale(0.4) rotate(-12deg); }
        60%  { transform: scale(1.15) rotate(4deg); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) {
        .mbti-a, .mbti-q:not(.hidden), #mbti-emoji { transition: none; animation: none; }
    }
</style>

<script th:src="@{/js/onboarding.js}"></script>
</body>
</html>
