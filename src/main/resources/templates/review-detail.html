<!DOCTYPE html>
<html class="light" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('여행페이지 · 여행 후기')}"></head>
<body class="bg-background text-text-primary font-body-main antialiased min-h-screen flex flex-col">

<header th:replace="~{fragments/layout :: header}"></header>

<main class="flex-1 pt-8 pb-section-gap px-4 max-w-[760px] mx-auto w-full">

    <div class="mb-8 animate-fade-up">
        <a th:href="@{/reviews}" class="inline-flex items-center text-text-muted hover:text-primary transition-colors">
            <span class="material-symbols-outlined mr-2">arrow_back</span>
            후기 둘러보기
        </a>
    </div>

    <!-- 1) 헤더: 지역 · 코스명 · 작성자 -->
    <section class="mb-section-gap animate-fade-up">
        <a th:href="@{/region(sigCd=${review.sigCd})}"
           class="font-caption text-caption text-primary hover:underline" th:text="${review.regionLabel}">경상북도 안동시</a>
        <h1 class="font-display-title text-display-title text-text-primary mt-2 mb-3" th:text="${review.courseTitle}">코스명</h1>
        <div class="flex items-center gap-2 font-caption text-caption text-text-muted flex-wrap">
            <span class="material-symbols-outlined text-[18px]">person</span>
            <span th:text="${review.nickname}">여행자</span>
            <span>·</span>
            <span th:text="${review.createdAt}">2026.07.30</span>
            <span th:if="${!review.shared}" class="chip">비공개</span>
            <!-- 어떤 성향의 사람이 쓴 후기인지 -->
            <span th:if="${review.mbti != null}" th:replace="~{fragments/brand :: mbtiBadge(${review.mbti})}"></span>
        </div>
    </section>

    <!-- 2) 사진 -->
    <section th:if="${!review.photos.isEmpty()}" class="mb-section-gap flex flex-col gap-3 animate-fade-up">
        <img th:each="p : ${review.photos}" th:src="${p}" alt="여행 사진"
             class="w-full rounded-xl border border-border" loading="lazy"/>
    </section>

    <!-- 3) 줄글 후기 -->
    <section class="bg-surface border border-border rounded-xl p-card-padding mb-section-gap animate-fade-up">
        <p class="font-body-main text-body-main text-text-primary whitespace-pre-line leading-relaxed"
           th:text="${review.content}">후기 본문</p>
    </section>

    <!-- 4) 다녀온 코스 -->
    <section th:if="${!review.stopNames.isEmpty()}" class="mb-section-gap animate-fade-up">
        <h2 class="font-card-title text-card-title text-text-primary mb-3">다녀온 코스</h2>
        <div class="bg-surface border border-border rounded-xl p-card-padding flex flex-wrap gap-2">
            <span th:each="name : ${review.stopNames}" class="chip" th:text="${name}">지점</span>
        </div>
    </section>

    <!-- 5) 액션: 공유 / 수정 / 이 지역 보기 -->
    <section class="flex flex-col sm:flex-row gap-4 animate-fade-up">
        <button type="button" id="share-btn" class="btn-primary flex-1"
                th:attr="data-share-title=${review.courseTitle} + ' 여행 후기'">
            <span class="material-symbols-outlined text-[20px]">share</span>
            <span id="share-label">링크 복사해 공유하기</span>
        </button>
        <a th:if="${review.mine}" th:href="@{/review/new(courseId=${review.courseId})}" class="btn-secondary flex-1">후기 수정</a>
        <a th:href="@{/region(sigCd=${review.sigCd})}" class="btn-secondary flex-1">이 지역 보기</a>
    </section>

    <!-- 6) 탐색 루프: 이 지역으로 내 코스 만들기 -->
    <section class="mt-section-gap bg-sage-bg border border-border rounded-xl p-card-padding flex items-center justify-between gap-4 animate-fade-up">
        <div>
            <p class="font-card-title text-card-title text-secondary mb-1">여기도 가보고 싶으신가요?</p>
            <p class="font-caption text-caption text-text-muted">같은 지역으로 나만의 코스를 만들어보세요.</p>
        </div>
        <a th:href="@{/course(sigCd=${review.sigCd})}" class="btn-secondary shrink-0">코스 만들기</a>
    </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/review-share.js}"></script>
</body>
</html>
