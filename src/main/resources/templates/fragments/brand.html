<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    여행 MBTI 뱃지.
    사용: <span th:replace="~{fragments/brand :: mbtiBadge(${type})}"></span>
    type 이 null 이면 아무것도 그리지 않는다(검사 전 사용자).
-->
<span th:fragment="mbtiBadge(type)" th:if="${type != null}"
      class="mbti-badge" th:title="${type.tagline}">
    <span th:text="${type.emoji}">🎈</span>
    <span class="mbti-badge__code" th:text="${type.code}">ENFP</span>
    <span class="mbti-badge__label" th:text="${type.label}">유형</span>
    <style>
        .mbti-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px 3px 8px;
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            border-radius: var(--radius-chip);
            font-size: var(--fs-caption);
            line-height: 1.6;
            white-space: nowrap;
            max-width: 100%;
        }
        .mbti-badge__code {
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--accent-hover);
        }
        .mbti-badge__label {
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 좁은 곳에서는 별명을 숨기고 코드만 남긴다 */
        @media (max-width: 480px) {
            .mbti-badge__label { display: none; }
        }
    </style>
</span>

<!--
    여행페이지 로고 마크 — 고양이 발자국 + 강아지 발자국 한 짝씩.
    두 발자국이 오른쪽 위로 걸어가는 배치로 '여행(이동)'을 나타낸다.
    색은 디자인 토큰을 그대로 쓴다: 고양이=세이지, 강아지=액센트.

    사용: <span th:replace="~{fragments/brand :: logoMark(28)}"></span>
-->
<svg th:fragment="logoMark(size)"
     th:attr="width=${size},height=${size}"
     viewBox="7.5 7.5 49 49" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="여행페이지" class="brand-mark">

    <!-- ===== 고양이 발자국 (작고 동글, 왼쪽 아래 · 살짝 기울임) ===== -->
    <g transform="translate(4 31) rotate(-12) scale(0.86)" fill="var(--sage, #7A9A7E)">
        <!-- 발가락 4개: 바깥쪽은 작고 낮게, 안쪽은 크고 높게 -->
        <ellipse cx="4.6" cy="12.6" rx="2.5" ry="3.1" transform="rotate(-22 4.6 12.6)"/>
        <ellipse cx="10.4" cy="8.4" rx="2.7" ry="3.4" transform="rotate(-8 10.4 8.4)"/>
        <ellipse cx="16.6" cy="8.4" rx="2.7" ry="3.4" transform="rotate(8 16.6 8.4)"/>
        <ellipse cx="22.4" cy="12.6" rx="2.5" ry="3.1" transform="rotate(22 22.4 12.6)"/>
        <!-- 발바닥: 아래가 살짝 하트처럼 들어가 귀여운 인상 -->
        <path d="M13.5 15.4c3.9 0 7.2 2.9 7.2 6.1 0 2.4-2.1 3.9-4.4 3.9-1.1 0-1.9-.35-2.8-.35s-1.7.35-2.8.35c-2.3 0-4.4-1.5-4.4-3.9 0-3.2 3.3-6.1 7.2-6.1z"/>
    </g>

    <!-- ===== 강아지 발자국 (조금 크고 넉넉, 오른쪽 위) ===== -->
    <g transform="translate(30 7) rotate(10)" fill="var(--accent, #D08A5D)">
        <ellipse cx="4.2" cy="13.4" rx="2.9" ry="3.7" transform="rotate(-24 4.2 13.4)"/>
        <ellipse cx="11" cy="8.2" rx="3.1" ry="4" transform="rotate(-9 11 8.2)"/>
        <ellipse cx="18.2" cy="8.2" rx="3.1" ry="4" transform="rotate(9 18.2 8.2)"/>
        <ellipse cx="25" cy="13.4" rx="2.9" ry="3.7" transform="rotate(24 25 13.4)"/>
        <path d="M14.6 16.2c4.5 0 8.4 3.4 8.4 7.1 0 2.8-2.5 4.5-5.1 4.5-1.2 0-2.2-.4-3.3-.4s-2.1.4-3.3.4c-2.6 0-5.1-1.7-5.1-4.5 0-3.7 3.9-7.1 8.4-7.1z"/>
    </g>
</svg>
</body>
</html>
