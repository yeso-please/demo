<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
    공통 레이아웃 프래그먼트
    사용 예:
      <head th:replace="~{fragments/layout :: head('페이지 제목')}"></head>
      <header th:replace="~{fragments/layout :: header}"></header>
      <footer th:replace="~{fragments/layout :: footer}"></footer>
-->

<!-- ===================== HEAD ===================== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="한국의 덜 알려진 여행지를 발굴해 나만의 여행 코스를 만드는 서비스">
    <title th:text="${title}">숨은여행</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">

    <!-- Fonts (CDN) -->
    <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
    <link rel="stylesheet"
          href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
    <!-- Material Symbols (Stitch 아이콘 공통) -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <!-- Tailwind Play CDN (유틸리티 엔진) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!--
        공통 Tailwind 설정.
        Stitch가 각 화면에 박아둔 tailwind.config 를 전부 제거하고,
        시맨틱 색·폰트·간격 키를 우리 tokens.css 의 CSS 변수로 매핑한다.
        => bg-background / text-text-primary / bg-primary-container 등이
           전부 var(--...) 로 해석되어 디자인 값의 단일 출처가 tokens.css 가 된다.
    -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "var(--bg)",
                        "surface": "var(--surface)",
                        "surface-alt": "var(--surface-alt)",
                        "surface-container": "var(--surface-alt)",
                        "surface-container-low": "var(--surface-alt)",
                        "surface-container-high": "var(--surface-alt)",
                        "surface-container-highest": "var(--surface-alt)",
                        "surface-container-lowest": "var(--surface)",
                        "surface-variant": "var(--surface-alt)",
                        "surface-bright": "var(--surface)",
                        "surface-dim": "var(--surface-alt)",
                        "border": "var(--border)",
                        "outline": "var(--text-muted)",
                        "outline-variant": "var(--border)",
                        "primary": "var(--accent)",
                        "primary-container": "var(--accent)",
                        "primary-fixed-dim": "var(--accent)",
                        "inverse-primary": "var(--accent)",
                        "accent-hover": "var(--accent-hover)",
                        "accent-soft": "var(--accent-soft)",
                        "text-primary": "var(--text)",
                        "text-muted": "var(--text-muted)",
                        "on-surface": "var(--text)",
                        "on-surface-variant": "var(--text)",
                        "on-background": "var(--text)",
                        "on-primary": "var(--on-accent)",
                        "on-primary-container": "var(--on-accent)",
                        "on-secondary": "var(--on-accent)",
                        "sage-bg": "var(--sage-bg)",
                        "sage-border": "var(--sage-border)",
                        "sage": "var(--sage)",
                        "secondary": "var(--sage)",
                        "on-secondary-fixed-variant": "var(--sage)",
                        "error": "var(--error)"
                    },
                    fontFamily: {
                        "body-main": "var(--font-sans)",
                        "body": "var(--font-sans)",
                        "section-title": "var(--font-sans)",
                        "card-title": "var(--font-sans)",
                        "caption": "var(--font-sans)",
                        "display-title": "var(--font-serif)",
                        "display-title-mobile": "var(--font-serif)",
                        "brand-logo": "var(--font-serif)"
                    },
                    fontSize: {
                        "display-title": ["36px", { lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "display-title-mobile": ["28px", { lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "section-title": ["22px", { lineHeight: "1.4", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "card-title": ["17px", { lineHeight: "1.4", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-main": ["15px", { lineHeight: "1.7", letterSpacing: "-0.01em", fontWeight: "400" }],
                        "body": ["15px", { lineHeight: "1.7", letterSpacing: "-0.01em", fontWeight: "400" }],
                        "caption": ["13px", { lineHeight: "1.5", letterSpacing: "-0.01em", fontWeight: "400" }]
                    },
                    spacing: {
                        "container-max": "var(--max-w)",
                        "card-padding": "var(--space-3)",
                        "section-gap": "var(--space-4)",
                        "grid-unit": "var(--space-1)"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "var(--radius-btn)",
                        "xl": "var(--radius-card)",
                        "full": "var(--radius-chip)",
                        "input": "var(--radius-btn)",
                        "card": "var(--radius-card)",
                        "login-card": "var(--radius-card)"
                    }
                }
            }
        }
    </script>

    <!-- Design tokens & 화면 애니메이션 -->
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
    <link rel="stylesheet" th:href="@{/css/trip.css}">
</head>

<body>

<!-- ===================== HEADER ===================== -->
<header th:fragment="header" class="site-header">
    <div class="site-header__inner">
        <!-- Logo: 발자국 마크 + 워드마크 -->
        <a th:href="@{/map}" class="site-logo" aria-label="숨은여행 홈">
            <span th:replace="~{fragments/brand :: logoMark(30)}"></span>
            <span class="site-logo__text">숨은여행</span>
        </a>

        <!-- Region search -->
        <form class="region-search" th:action="@{/region/panel}" method="get" role="search">
            <svg class="region-search__icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" name="q" class="region-search__input"
                   placeholder="지역을 검색해 보세요" aria-label="지역 검색">
        </form>

        <!-- Nav — 화면 플로우 순서 그대로: 적는다 → 켜진다 → 나간다 → 담은 것 → 남의 이야기.
             '맞춤 여행'(조건 폼 → 후보 3안)은 다이어리가 대체한 이전 기획이라 뺐다.
             다이어리는 이 서비스의 유일한 입력이므로 모든 화면에서 한 번에 닿아야 한다. -->
        <nav class="site-nav">
            <a th:href="@{/onboarding/visits}" class="site-nav__link site-nav__link--ai">
                <span class="material-symbols-outlined">edit_note</span>
                여행 기록
            </a>
            <a th:href="@{/my/discoveries}" class="site-nav__link">
                <span class="material-symbols-outlined">map</span>
                내 지도
            </a>
            <a th:href="@{/nearby}" class="site-nav__link">
                <span class="material-symbols-outlined">near_me</span>
                근처
            </a>
            <a th:if="${currentUser != null}" th:href="@{/my/courses}" class="site-nav__link">
                <span class="material-symbols-outlined">bookmark</span>
                내 코스
            </a>
            <a th:href="@{/reviews}" class="site-nav__link">
                <span class="material-symbols-outlined">rate_review</span>
                후기
            </a>
        </nav>

        <!-- 로그인 상태: 프로필 링크 / 비로그인: 로그인·회원가입 -->
        <div th:if="${currentUser != null}" class="site-account">
            <a th:href="@{/profile}" class="site-profile-link" th:title="${currentUser.nickname}">
                <img th:if="${currentUser.profileImage != null}" th:src="${currentUser.profileImage}"
                     alt="프로필" class="site-avatar"/>
                <span th:if="${currentUser.profileImage == null}" class="site-avatar site-avatar--initial"
                      th:text="${currentUser.initial()}">여</span>
                <span class="site-account__name" th:text="${currentUser.nickname}">닉네임</span>
            </a>
            <form th:action="@{/logout}" method="post" class="site-logout-form">
                <button type="submit" class="site-nav__link" title="로그아웃">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </form>
        </div>
        <div th:if="${currentUser == null}" class="site-account">
            <a th:href="@{/}" class="site-nav__link">로그인</a>
            <a th:href="@{/signup}" class="btn-primary site-signup-btn">회원가입</a>
        </div>
    </div>

    <style>
        .site-header {
            height: 64px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .site-header__inner {
            max-width: var(--max-w);
            height: 100%;
            margin: 0 auto;
            padding: 0 var(--space-3);
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        .site-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-serif);
            font-size: var(--fs-section);
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
        }
        .site-logo .brand-mark { flex-shrink: 0; }
        /* 로고에 마우스를 올리면 발자국이 살짝 걸어나가는 느낌 */
        .site-logo .brand-mark { transition: transform var(--transition); }
        .site-logo:hover .brand-mark { transform: translateX(2px) rotate(-4deg); }
        /* 좁은 화면에서는 마크만 남긴다 */
        @media (max-width: 640px) {
            .site-logo__text { display: none; }
        }
        .region-search {
            flex: 1;
            max-width: 520px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: var(--space-1);
            height: 42px;
            padding: 0 var(--space-2);
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-chip);
            transition: border-color var(--transition), background var(--transition);
        }
        .region-search:focus-within {
            border-color: var(--accent);
            background: var(--surface);
        }
        .region-search__icon { color: var(--text-muted); flex-shrink: 0; }
        .region-search__input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: var(--fs-body);
        }
        .region-search__input::placeholder { color: var(--text-muted); }
        .site-profile {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: var(--radius-chip);
            color: var(--text-muted);
            cursor: pointer;
            transition: border-color var(--transition), color var(--transition);
        }
        .site-profile:hover { border-color: var(--accent); color: var(--accent); }
        .site-nav {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            flex-shrink: 0;
        }
        .site-nav__link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 42px;
            padding: 0 var(--space-2);
            border-radius: var(--radius-chip);
            color: var(--text-muted);
            font-size: var(--fs-caption);
            white-space: nowrap;
            transition: background var(--transition), color var(--transition);
        }
        .site-nav__link:hover { background: var(--accent-soft); color: var(--accent); }
        .site-nav__link .material-symbols-outlined { font-size: 18px; }
        /* 조건 탐색은 지도 발견을 대체하지 않는 보조 진입점이다 */
        .site-nav__link--ai {
            color: var(--text-muted);
            background: transparent;
            font-weight: 400;
        }
        .site-nav__link--ai:hover { background: var(--accent); color: var(--on-accent); }
        /* 로그아웃 버튼도 링크와 같은 모양으로 */
        button.site-nav__link { border: none; background: none; cursor: pointer; }
        .site-account {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            flex-shrink: 0;
        }
        .site-logout-form { display: flex; }
        .site-profile-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            height: 42px;
            padding: 0 var(--space-2) 0 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius-chip);
            transition: border-color var(--transition);
        }
        .site-profile-link:hover { border-color: var(--accent); }
        .site-avatar {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-chip);
            object-fit: cover;
            flex-shrink: 0;
        }
        .site-avatar--initial {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 700;
            font-size: var(--fs-caption);
        }
        .site-account__name {
            font-size: var(--fs-caption);
            color: var(--text);
            max-width: 110px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .site-signup-btn { height: 42px; padding: 0 var(--space-2); font-size: var(--fs-caption); }
        @media (max-width: 860px) {
            .site-account__name { display: none; }
            .site-profile-link { padding: 0 6px; }
        }
        /* 좁은 화면에서는 아이콘만 노출 */
        @media (max-width: 860px) {
            .site-nav__link { padding: 0 var(--space-1); font-size: 0; gap: 0; }
            .site-nav__link .material-symbols-outlined { font-size: 20px; }
        }
    </style>
</header>

<!-- ===================== FOOTER ===================== -->
<footer th:fragment="footer" class="site-footer">
    <div class="site-footer__inner">
        <p class="site-footer__sources">
            데이터 출처 · 한국관광공사 TourAPI · 한국관광 데이터랩 · 행정안전부 착한가격업소
        </p>
    </div>

    <style>
        .site-footer {
            margin-top: var(--space-4);
            border-top: 1px solid var(--border);
            background: var(--surface);
        }
        .site-footer__inner {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: var(--space-3);
        }
        .site-footer__sources {
            font-size: var(--fs-caption);
            color: var(--text-muted);
        }
    </style>
</footer>

</body>
</html>
