<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('여행페이지 · 회원가입')}"></head>
<body class="bg-background text-text-primary min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Card Container -->
<div class="bg-surface w-full max-w-[400px] border border-border rounded-xl p-[32px] relative overflow-hidden">
    <!-- Subtle decorative element -->
    <div class="absolute top-0 right-0 w-24 h-24 bg-surface-alt rounded-bl-full -z-10 opacity-50"></div>
    <!-- Brand Logo -->
    <div class="flex flex-col items-center text-center mb-8">
        <span th:replace="~{fragments/brand :: logoMark(52)}"></span>
        <h1 class="font-brand-logo text-[24px] text-text-primary tracking-tight mt-2">여행페이지</h1>
    </div>
    <!-- 가입 실패 안내 -->
    <div th:if="${error}" class="mb-4 border-2 rounded-lg p-3 text-center" style="border-color: var(--error)">
        <span class="font-caption text-caption" style="color: var(--error)" th:text="${error}">오류</span>
    </div>
    <!-- Sign Up Form: 가입 → 자동 로그인 → /onboarding -->
    <form class="space-y-6" id="signupForm" th:action="@{/signup}" method="post">
        <!-- Email Field -->
        <div class="space-y-1">
            <label class="block font-body-main text-body-main text-text-primary" for="email">이메일</label>
            <div class="relative">
                <input class="input-field w-full h-[44px] px-3 py-2 bg-surface border border-border rounded-lg font-body-main text-body-main text-text-primary placeholder:text-text-muted" id="email" name="email" th:value="${email}" placeholder="이메일 주소를 입력하세요" required type="email"/>
                <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-secondary hidden">check</span>
            </div>
        </div>
        <!-- Password Field -->
        <div class="space-y-1">
            <label class="block font-body-main text-body-main text-text-primary" for="password">비밀번호</label>
            <div class="relative">
                <input class="input-field w-full h-[44px] px-3 py-2 bg-surface border border-border rounded-lg font-body-main text-body-main text-text-primary placeholder:text-text-muted" id="password" name="password" minlength="8" placeholder="비밀번호를 만드세요 (8자 이상)" required type="password"/>
                <p class="font-caption text-caption text-outline mt-1 hidden">비밀번호는 최소 8자 이상이어야 합니다.</p>
            </div>
        </div>
        <!-- Confirm Password Field -->
        <div class="space-y-1">
            <label class="block font-body-main text-body-main text-text-primary" for="confirm-password">비밀번호 확인</label>
            <div class="relative">
                <input class="input-field w-full h-[44px] px-3 py-2 bg-surface border border-border rounded-lg font-body-main text-body-main text-text-primary placeholder:text-text-muted" id="confirm-password" name="confirmPassword" minlength="8" placeholder="비밀번호를 다시 입력하세요" required type="password"/>
                <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-secondary hidden">check</span>
            </div>
        </div>
        <!-- Nickname Field -->
        <div class="space-y-1">
            <label class="block font-body-main text-body-main text-text-primary" for="nickname">닉네임</label>
            <div class="relative">
                <input class="input-field w-full h-[44px] px-3 py-2 bg-surface border border-border rounded-lg font-body-main text-body-main text-text-primary placeholder:text-text-muted" id="nickname" name="nickname" th:value="${nickname}" maxlength="30" placeholder="닉네임을 정해주세요" required type="text"/>
            </div>
        </div>
        <!-- Primary Button -->
        <button class="btn-primary w-full h-[44px] bg-primary-container text-on-primary font-card-title text-card-title rounded-lg flex items-center justify-center mt-8" type="submit">
            가입하기
        </button>
    </form>
    <!-- Bottom Link -->
    <div class="mt-6 text-center">
        <p class="font-body-main text-caption text-text-primary">
            이미 계정이 있으신가요?
            <a class="text-primary-container hover:text-accent-hover font-semibold transition-colors" th:href="@{/}">로그인</a>
        </p>
    </div>
</div>
<script th:src="@{/js/signup.js}"></script>
</body>
</html>
