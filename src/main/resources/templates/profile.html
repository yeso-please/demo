<!DOCTYPE html>
<html class="light" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('여행페이지 · 프로필')}"></head>
<body class="bg-background text-text-primary font-body-main antialiased min-h-screen flex flex-col">

<header th:replace="~{fragments/layout :: header}"></header>

<main class="flex-1 pt-8 pb-section-gap px-4 max-w-[760px] mx-auto w-full">

    <h1 class="font-display-title text-display-title text-text-primary mb-6">프로필</h1>

    <!-- 저장 결과 안내 -->
    <div th:if="${message}" class="mb-4 bg-sage-bg border-2 border-sage rounded-lg p-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-sage">check_circle</span>
        <span class="font-body-main text-body-main text-text-primary" th:text="${message}">저장했어요</span>
    </div>
    <div th:if="${error}" class="mb-4 bg-surface border-2 border-error rounded-lg p-4 flex items-center gap-2">
        <span class="material-symbols-outlined" style="color: var(--error)">error</span>
        <span class="font-body-main text-body-main" style="color: var(--error)" th:text="${error}">오류</span>
    </div>

    <!-- 1) 요약 카드 -->
    <section class="bg-surface border-2 border-border rounded-xl p-card-padding shadow-sm mb-6 flex items-center gap-5">
        <!-- 아바타 (사진 없으면 이니셜) -->
        <img th:if="${user.profileImage != null}" th:src="${user.profileImage}" alt="프로필 사진"
             class="w-20 h-20 rounded-full object-cover border-2 border-border shrink-0"/>
        <div th:if="${user.profileImage == null}"
             class="w-20 h-20 rounded-full bg-accent-soft border-2 border-border flex items-center justify-center shrink-0">
            <span class="font-display-title text-[28px] text-primary" th:text="${user.initial()}">여</span>
        </div>

        <div class="min-w-0 flex-1">
            <h2 class="font-section-title text-section-title text-text-primary truncate" th:text="${user.nickname}">닉네임</h2>
            <p class="font-caption text-caption text-text-muted truncate" th:text="${user.email}">email@example.com</p>
            <!-- 여행 MBTI -->
            <div class="mt-2 flex items-center gap-2 flex-wrap">
                <span th:replace="~{fragments/brand :: mbtiBadge(${user.mbtiType()})}"></span>
                <a th:href="@{/onboarding}"
                   class="font-caption text-caption text-text-muted hover:text-primary transition-colors"
                   th:text="${user.mbtiType() != null} ? '다시 검사' : '여행 MBTI 검사하기 →'">여행 MBTI 검사하기 →</a>
            </div>
            <p th:if="${user.bio != null and !user.bio.isBlank()}"
               class="font-body-main text-body-main text-text-primary mt-2" th:text="${user.bio}">소개</p>
        </div>
    </section>

    <!-- 2) 활동 — 이 서비스의 활동은 '쓴 편 수'와 '켠 지역 수'가 먼저다.
         코스·후기는 그 결과로 쌓인다. -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <a th:href="@{/onboarding/visits}"
           class="bg-surface border-2 border-border rounded-xl p-card-padding shadow-sm hover:border-primary transition-colors">
            <span class="font-caption text-caption text-text-muted block mb-1">내가 쓴 여행</span>
            <span class="font-display-title text-[28px] text-primary" th:text="${visitCount}">0</span>
        </a>
        <a th:href="@{/my/discoveries}"
           class="bg-surface border-2 border-border rounded-xl p-card-padding shadow-sm hover:border-primary transition-colors">
            <span class="font-caption text-caption text-text-muted block mb-1">불 켠 지역</span>
            <span class="font-display-title text-[28px] text-primary" th:text="${visitCount}">0</span>
        </a>
        <a th:href="@{/my/courses}"
           class="bg-surface border-2 border-border rounded-xl p-card-padding shadow-sm hover:border-primary transition-colors">
            <span class="font-caption text-caption text-text-muted block mb-1">내가 만든 코스</span>
            <span class="font-display-title text-[28px] text-text-primary" th:text="${courseCount}">0</span>
        </a>
        <a th:href="@{/reviews}"
           class="bg-surface border-2 border-border rounded-xl p-card-padding shadow-sm hover:border-primary transition-colors">
            <span class="font-caption text-caption text-text-muted block mb-1">내가 쓴 후기</span>
            <span class="font-display-title text-[28px] text-text-primary" th:text="${reviewCount}">0</span>
        </a>
    </section>

    <!-- 3) 프로필 수정 -->
    <section class="bg-surface border-2 border-border rounded-xl p-card-padding shadow-sm mb-6">
        <h3 class="font-section-title text-section-title text-text-primary mb-4">프로필 수정</h3>
        <form th:action="@{/profile}" method="post" enctype="multipart/form-data" class="flex flex-col gap-4">
            <div>
                <label for="nickname" class="font-caption text-caption text-text-primary font-semibold block mb-1">닉네임</label>
                <input id="nickname" name="nickname" type="text" required maxlength="30" th:value="${user.nickname}"
                       class="w-full h-[44px] px-4 bg-surface-alt border-2 border-border rounded-lg font-body-main text-body-main text-text-primary focus:outline-none focus:border-primary focus:bg-surface transition-colors"/>
            </div>
            <div>
                <label for="bio" class="font-caption text-caption text-text-primary font-semibold block mb-1">한 줄 소개</label>
                <input id="bio" name="bio" type="text" maxlength="200" th:value="${user.bio}"
                       placeholder="예) 조용한 바닷가 마을을 좋아합니다"
                       class="w-full h-[44px] px-4 bg-surface-alt border-2 border-border rounded-lg font-body-main text-body-main text-text-primary placeholder:text-text-muted focus:outline-none focus:border-primary focus:bg-surface transition-colors"/>
            </div>
            <div>
                <label for="profileImage" class="font-caption text-caption text-text-primary font-semibold block mb-1">프로필 사진</label>
                <input id="profileImage" name="profileImage" type="file" accept="image/*"
                       class="w-full font-caption text-caption text-text-muted file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-accent-soft file:text-primary file:font-semibold file:cursor-pointer"/>
                <p class="font-caption text-caption text-text-muted mt-1">선택하지 않으면 기존 사진이 유지됩니다.</p>
            </div>
            <button type="submit" class="btn-primary self-start">
                <span class="material-symbols-outlined text-[20px]">save</span>
                저장하기
            </button>
        </form>
    </section>

    <!-- 4) 비밀번호 변경 -->
    <section class="bg-surface border-2 border-border rounded-xl p-card-padding shadow-sm mb-6">
        <h3 class="font-section-title text-section-title text-text-primary mb-4">비밀번호 변경</h3>
        <form th:action="@{/profile/password}" method="post" class="flex flex-col gap-4">
            <input name="currentPassword" type="password" required placeholder="현재 비밀번호"
                   class="w-full h-[44px] px-4 bg-surface-alt border-2 border-border rounded-lg font-body-main text-body-main text-text-primary placeholder:text-text-muted focus:outline-none focus:border-primary focus:bg-surface transition-colors"/>
            <input name="newPassword" type="password" required minlength="8" placeholder="새 비밀번호 (8자 이상)"
                   class="w-full h-[44px] px-4 bg-surface-alt border-2 border-border rounded-lg font-body-main text-body-main text-text-primary placeholder:text-text-muted focus:outline-none focus:border-primary focus:bg-surface transition-colors"/>
            <input name="confirmPassword" type="password" required minlength="8" placeholder="새 비밀번호 확인"
                   class="w-full h-[44px] px-4 bg-surface-alt border-2 border-border rounded-lg font-body-main text-body-main text-text-primary placeholder:text-text-muted focus:outline-none focus:border-primary focus:bg-surface transition-colors"/>
            <button type="submit" class="btn-secondary self-start">비밀번호 변경</button>
        </form>
    </section>

    <!-- 5) 로그아웃 -->
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-secondary w-full sm:w-auto">
            <span class="material-symbols-outlined text-[20px]">logout</span>
            로그아웃
        </button>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
