<!DOCTYPE html>
<html class="light" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('여행페이지 · 로그인')}"></head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center font-body-main text-text-primary antialiased">
<!-- 로그인은 트랜잭션 화면이라 공통 header/footer 를 넣지 않는다 (지침 6) -->
<main class="w-full max-w-[400px] px-4">
    <!-- Login Card -->
    <div class="bg-surface border border-border rounded-login-card p-8 shadow-none transition-transform duration-300 hover:-translate-y-[2px]">
        <!-- Header -->
        <div class="flex flex-col items-center text-center mb-8">
            <span th:replace="~{fragments/brand :: logoMark(56)}"></span>
            <h1 class="font-brand-logo brand-wordmark text-[24px] tracking-tight mt-2 mb-2">여행페이지</h1>
            <p class="font-caption text-caption text-text-muted">아직 아무도 모르는 여행지를 찾아드립니다</p>
        </div>
        <!-- 로그인 실패 / 로그아웃 안내 -->
        <div th:if="${param.error}" class="mb-4 border-2 rounded-lg p-3 text-center"
             style="border-color: var(--error)">
            <span class="font-caption text-caption" style="color: var(--error)">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </span>
        </div>
        <div th:if="${param.logout}" class="mb-4 bg-sage-bg border-2 border-sage rounded-lg p-3 text-center">
            <span class="font-caption text-caption text-secondary">로그아웃했습니다.</span>
        </div>

        <!-- Form: Spring Security 폼 로그인 (아이디 = 이메일) -->
        <form class="space-y-4" id="loginForm" th:action="@{/login}" method="post">
            <div>
                <label class="sr-only" for="email">이메일</label>
                <input class="w-full h-[44px] px-4 bg-surface border border-border rounded-input font-body-main text-body-main text-text-primary placeholder:text-text-muted focus:outline-none focus:border-primary-container focus:ring-0 transition-colors duration-250" id="email" name="email" placeholder="이메일 주소" required type="email"/>
            </div>
            <div>
                <label class="sr-only" for="password">비밀번호</label>
                <input class="w-full h-[44px] px-4 bg-surface border border-border rounded-input font-body-main text-body-main text-text-primary placeholder:text-text-muted focus:outline-none focus:border-primary-container focus:ring-0 transition-colors duration-250" id="password" name="password" placeholder="비밀번호" required type="password"/>
            </div>
            <button class="w-full h-[44px] bg-primary-container hover:bg-accent-hover text-on-primary font-card-title text-card-title rounded-input transition-colors duration-300 flex items-center justify-center gap-2 mt-2" id="loginBtn" type="submit">
                <span id="btnText">로그인</span>
                <div class="spinner hidden" id="btnSpinner"></div>
            </button>
        </form>
        <!-- Divider -->
        <div class="flex items-center my-6">
            <div class="flex-grow border-t border-border"></div>
            <span class="mx-4 font-caption text-caption text-text-muted">또는</span>
            <div class="flex-grow border-t border-border"></div>
        </div>
        <!-- Social Login -->
        <div class="space-y-3">
            <button class="w-full h-[44px] bg-surface border border-border hover:bg-surface-alt rounded-input font-body-main text-body-main text-text-primary transition-colors duration-300 flex items-center justify-center gap-2" type="button">
                <span class="font-bold text-[color:var(--brand-kakao)] leading-none">K</span>
                <span>카카오로 시작하기</span>
            </button>
            <button class="w-full h-[44px] bg-surface border border-border hover:bg-surface-alt rounded-input font-body-main text-body-main text-text-primary transition-colors duration-300 flex items-center justify-center gap-2" type="button">
                <span class="font-bold text-[color:var(--brand-google)] leading-none">G</span>
                <span>Google로 시작하기</span>
            </button>
        </div>
        <!-- 로그인 없이 들어오는 문.
             다이어리는 로그인을 요구하지 않는다(세션에 담고, 가입하면 옮긴다).
             첫 가치 경험을 로그인 뒤로 미루면 그 자리에서 그냥 나간다. -->
        <a th:href="@{/onboarding/visits}"
           class="mt-6 w-full h-[48px] rounded-lg border border-border bg-surface-alt
                  flex items-center justify-center gap-2 hover:border-primary transition-colors">
            <span class="material-symbols-outlined text-primary text-[20px]">edit_note</span>
            <span class="font-body-main text-body-main text-text-primary">가입 없이 여행 한 편 적어보기</span>
        </a>

        <!-- Footer Links -->
        <div class="mt-8 flex justify-center gap-4 font-caption text-caption text-text-muted">
            <a class="hover:text-primary transition-colors" th:href="@{/signup}">회원가입</a>
            <span class="text-border">|</span>
            <a class="hover:text-primary transition-colors" href="#">비밀번호 찾기</a>
        </div>
    </div>
</main>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
