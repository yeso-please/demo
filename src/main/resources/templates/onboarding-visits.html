<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('여행 기록 — 숨은여행')}"></head>
<body class="bg-background text-text-primary min-h-screen flex flex-col">

<header th:replace="~{fragments/layout :: header}"></header>

<main class="flex-1 w-full max-w-5xl mx-auto px-4 py-8"
      th:attr="data-course-id=${courseId}, data-course-sig=${courseSigCd}, data-course-title=${courseTitle}">

    <!-- 머리말 -->
    <section class="flex flex-wrap items-end justify-between gap-5 mb-6">
        <div class="flex flex-col gap-1.5">
            <span class="font-caption text-caption text-text-muted tracking-[0.12em]">여행 기록</span>
            <h1 class="font-display-title text-display-title text-primary"
                th:text="${courseId != null} ? '다녀오신 여행은 어떠셨나요' : '기억에 남은 여행을 적어주세요'">
                기억에 남은 여행을 적어주세요
            </h1>
            <p class="font-body-main text-body text-text-muted max-w-2xl"
               th:text="${courseId != null}
                        ? '이 글은 다음 추천을 바꿔요. 좋았던 것도, 아니었던 것도 그대로 적어주세요.'
                        : '잘 쓰지 않아도 돼요. 무엇이 좋았는지만 적히면 그 결을 읽습니다.'">
                잘 쓰지 않아도 돼요.
            </p>
        </div>
        <div class="flex items-center gap-2">
            <span id="count" class="font-caption text-caption text-text-muted">0편</span>
        </div>
        <p th:if="${!loggedIn}" class="w-full font-caption text-caption text-text-muted">
            로그인하지 않아도 됩니다. 쓴 내용은 이 브라우저 세션에 임시 보관돼요.
        </p>
    </section>

    <!-- 지금 쓰는 편 -->
    <section id="sheet" class="bg-surface border border-border rounded-card overflow-hidden mb-5">

        <!-- 지역 고르기 (아직 안 골랐을 때) -->
        <div id="pick" class="p-card-padding">
            <h2 class="font-body-main text-body mb-3">어디를 다녀오셨나요?</h2>
            <div class="relative">
                <label for="region-input" class="sr-only">지역 검색</label>
                <input id="region-input" type="text" autocomplete="off"
                       placeholder="지역 이름을 적어주세요 (예: 통영)"
                       class="w-full px-4 py-3 rounded-input bg-surface-alt border border-border
                              font-body-main text-body focus:outline-none focus:ring-2 focus:ring-primary/40">
                <ul id="region-list"
                    class="mt-2 max-h-52 overflow-y-auto hidden bg-surface-alt border border-border rounded-input"></ul>
            </div>
            <button type="button" id="open-map"
                    class="mt-3 font-caption text-caption text-primary hover:underline">
                지도에서 고를게요
            </button>
        </div>

        <!-- 쓰는 자리 — 앱의 패널이 아니라 한 장의 종이로 보이게 한다 -->
        <div id="write" class="hidden paper">
            <!-- 코스에서 들어온 '기록'임을 밝힌다. 이 편에는 코스가 붙는다 -->
            <div th:if="${courseId != null}"
                 class="flex items-center gap-2 px-card-padding pt-4 pb-0">
                <span class="material-symbols-outlined text-primary text-[18px]">route</span>
                <span class="font-caption text-caption text-text-muted">
                    다녀온 코스 · <b class="text-primary" th:text="${courseTitle}">코스명</b>
                </span>
            </div>
            <!-- 일지의 첫 줄 — 언제, 어디 -->
            <div class="paper-head flex items-baseline gap-3.5">
                <label for="w-when" class="sr-only">언제</label>
                <input id="w-when" type="text" placeholder="언제쯤이었나요" class="when-field">
                <span id="w-region" class="region-name">군산</span>
                <button type="button" id="w-change" class="change-btn">지역 바꾸기</button>
            </div>

            <!-- 본문 : 겹쳐 놓은 하이라이트 + 입력 -->
            <div class="px-card-padding pt-7 pb-3 pl-9">
                <div id="editor" class="editor-wrap">
                    <div id="marks" class="editor-layer" aria-hidden="true"></div>
                    <textarea id="w-note" rows="6" spellcheck="false"
                              class="editor-layer editor-input"
                              placeholder="그날 무엇을 했는지, 무엇이 좋았는지 편하게 적어주세요."></textarea>
                </div>
            </div>

            <!-- 읽힌 것 -->
            <div id="read-row" class="px-card-padding pb-5 flex items-center gap-2.5 flex-wrap hidden">
                <span class="font-caption text-caption text-text-muted">이 글에서 읽었어요</span>
                <div id="read-tags" class="flex gap-1.5 flex-wrap"></div>
                <span class="font-caption text-caption text-text-muted">— 아닌 건 눌러서 빼세요</span>
            </div>

            <div class="h-px" style="background:rgba(239,193,123,.14)"></div>

            <div class="px-card-padding py-4 flex items-center gap-3.5 flex-wrap">
                <span class="font-caption text-caption text-text-muted">이 여행은</span>
                <div id="w-sat" class="flex gap-2 flex-wrap">
                    <button type="button" data-value="again" class="sat-btn">또 가고 싶다</button>
                    <button type="button" data-value="good"  class="sat-btn">좋았다</button>
                    <button type="button" data-value="soso"  class="sat-btn">그저 그랬다</button>
                    <button type="button" data-value="bad"   class="sat-btn">나와 안 맞았다</button>
                </div>
                <button type="button" id="w-save"
                        class="ml-auto px-5 py-2.5 rounded-input bg-primary text-on-primary
                               font-body-main text-body font-semibold hover:bg-accent-hover transition-colors">
                    기록하기
                </button>
            </div>
        </div>
    </section>

    <!-- 지도 (지도에서 고를게요) -->
    <section id="map-wrap" class="hidden bg-surface border border-border rounded-card overflow-hidden mb-5">
        <div class="flex items-center justify-between px-card-padding py-3 border-b border-border">
            <h2 class="font-body-main text-body">지도에서 고르기</h2>
            <button type="button" id="map-close"
                    class="font-caption text-caption text-text-muted hover:text-primary">닫기</button>
        </div>
        <div class="relative">
            <div id="map-loading" class="absolute inset-0 flex items-center justify-center bg-surface z-10">
                <span class="font-caption text-caption text-text-muted">지도를 불러오는 중…</span>
            </div>
            <svg id="visit-map" class="w-full h-auto" viewBox="0 0 800 1000"
                 preserveAspectRatio="xMidYMid meet" role="img"
                 aria-label="대한민국 시군구 지도 — 다녀온 지역을 고르세요"></svg>
        </div>
    </section>

    <!-- 앞서 쓴 기록 -->
    <section class="flex flex-col gap-2.5">
        <span class="font-caption text-caption text-text-muted">앞서 쓴 기록</span>
        <div id="entries" class="flex flex-wrap gap-2.5"></div>
        <p id="entries-empty" class="font-caption text-caption text-text-muted">
            아직 없어요. 한 편만 써도 결과를 볼 수 있고, 더 쓸수록 덜 흔들립니다.
        </p>
    </section>

    <div class="mt-7 flex items-center gap-4 flex-wrap">
        <button type="button" id="done" disabled
                class="px-6 py-3 rounded-input bg-primary text-on-primary font-body-main text-body font-semibold
                       disabled:bg-surface-alt disabled:text-text-muted disabled:cursor-not-allowed
                       hover:bg-accent-hover transition-colors">
            내 취향 코스 불 켜기
        </button>
        <span id="done-hint" class="font-caption text-caption text-text-muted"></span>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<style>
    /* ── 종이 ──
       앱의 패널이 아니라 한 장의 종이로 보이게 한다. 배경보다 살짝 밝고 따뜻하게 두고,
       그림자로 살짝 띄운다. 다이어리는 '화면'이 아니라 '물건'이어야 쓰고 싶어진다. */
    .paper {
        background: #302018;
        border-top: 1px solid rgba(239, 193, 123, .16);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 18px 40px rgba(0,0,0,.28);
    }

    .paper-head {
        padding: 1.5rem var(--space-3) .9rem;
        border-bottom: 1px solid rgba(239, 193, 123, .18);
    }
    .when-field {
        background: none; border: 0; outline: none;
        font-family: var(--font-serif); font-size: .95rem; color: var(--text-muted);
        width: 6.5rem; flex: none; text-align: right;
    }
    .when-field::placeholder { color: var(--text-muted); opacity: .75; }
    .region-name { font-family: var(--font-serif); font-size: 1.5rem; color: var(--accent); }
    /* 날짜와 지역 사이의 가운뎃점 — 일지의 첫 줄처럼 */
    .paper-head .region-name::before {
        content: '·'; color: var(--text-muted); margin-right: .6rem; font-size: 1rem;
    }
    .change-btn {
        margin-left: auto; flex: none;
        font-size: .8rem; color: var(--text-muted);
        border: 1px solid var(--border); border-radius: 999px;
        padding: .2rem .7rem; background: none; cursor: pointer;
    }
    .change-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* 본문 — 하이라이트 층과 입력 층을 정확히 겹친다.
       두 층의 글꼴·크기·자간·줄높이·여백이 하나라도 어긋나면 밑줄이 글자에서 밀린다.
       줄높이를 배수(2.05)가 아니라 정수 px 로 못박은 이유: 아래 괘선이 이 값에 맞춰
       그려지므로 소수점이 남으면 줄이 글자에서 조금씩 밀린다. */
    .editor-wrap {
        position: relative;
        min-height: calc(34px * 6);
        /* 괘선 — 다이어리를 다이어리로 보이게 하는 단 하나의 신호 */
        background-image: repeating-linear-gradient(
            to bottom,
            transparent 0 33px,
            rgba(158, 188, 222, .11) 33px 34px);
        /* 줄이 글자 '아래'에 와야 노트로 읽힌다.
           34px 줄상자에서 17px 글자의 베이스라인은 위에서 약 24px 지점이라,
           맨 아래(33px)에 그은 줄은 9px 만큼 떠 보인다 — 그만큼 끌어올린다. */
        background-position: 0 -9px;
    }
    /* 노트의 왼쪽 여백선 */
    .editor-wrap::before {
        content: ''; position: absolute; top: -.4rem; bottom: -.4rem; left: -1.15rem;
        width: 1px; background: rgba(239, 193, 123, .28);
    }
    .editor-layer {
        position: absolute; inset: 0;
        margin: 0; padding: 0; border: 0;
        font-family: var(--font-serif); font-size: 1.0625rem; line-height: 34px;
        letter-spacing: normal; white-space: pre-wrap; word-break: break-word;
    }
    #marks { color: transparent; pointer-events: none; }
    #marks mark { background: none; color: transparent; border-bottom: 1px solid rgba(255,198,97,.5); }
    .editor-input {
        background: transparent; color: var(--text); resize: none;
        caret-color: var(--accent);
    }
    /* 자동 포커스로 열리는 화면이라 기본 포커스 링이 종이 위에 파란 상자로 남는다.
       대신 왼쪽 여백선을 밝혀 '여기 쓰는 중'을 표시한다. */
    .editor-input:focus,
    .editor-input:focus-visible { outline: none; box-shadow: none; border: 0; }
    .editor-wrap:focus-within::before { background: var(--accent); }
    .editor-input::placeholder { color: var(--text-muted); }

    .sat-btn {
        padding: .45rem .9rem; border-radius: 999px; border: 1px solid var(--border);
        background: var(--surface-alt); color: var(--text); font-size: .875rem; transition: all .15s;
    }
    .sat-btn:hover { border-color: var(--accent); }
    .sat-btn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

    .read-chip {
        font-size: .75rem; padding: .15rem .6rem; border-radius: 999px;
        background: var(--accent-soft); color: var(--accent-hover);
        border: 1px solid transparent; cursor: pointer;
    }
    .read-chip.off { background: transparent; border-color: var(--border); color: var(--text-muted); }

    .entry {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
        padding: .85rem 1rem; min-width: 250px; max-width: 320px;
        display: flex; flex-direction: column; gap: .3rem; cursor: pointer;
    }
    .entry:hover { border-color: var(--accent); }
    .entry .e-head { font-family: var(--font-serif); font-size: 1rem; color: var(--accent); }
    .entry .e-body {
        font-size: .78rem; color: var(--text-muted); line-height: 1.6;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .entry .e-foot { font-size: .72rem; color: var(--accent-hover); }
    .entry-add {
        background: var(--surface-alt); border: 1px dashed var(--border); border-radius: var(--radius-card);
        padding: .85rem 1rem; min-width: 170px; display: flex; align-items: center; justify-content: center;
        color: var(--text-muted); font-size: .875rem; cursor: pointer;
    }
    .entry-add:hover { border-color: var(--accent); color: var(--accent); }

    #region-list li { padding: .55rem .8rem; cursor: pointer; font-size: .9rem; }
    #region-list li:hover { background: var(--accent-soft); color: var(--accent-hover); }
    .sig-path { fill: var(--map-land); stroke: var(--map-stroke); stroke-width: .85px;
                vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .15s; }
    .sig-path:hover { fill: var(--accent-soft); }
    .sig-path.written { fill: var(--accent); stroke: var(--accent-hover); }
</style>

<script src="/js/d3-array.min.js"></script>
<script src="/js/d3-geo.min.js"></script>
<script src="/js/topojson-client.min.js"></script>
<script src="/js/onboarding-visits.js"></script>
</body>
</html>
