spring:
  config:
    import: "optional:file:./config/application-secret.yaml"
  application:
    name: hidden-travel
  thymeleaf:
    cache: false

  # 개발 중 js/css 를 브라우저가 캐시해 옛 버전을 쓰는 문제 방지.
  # (템플릿과 js 를 함께 고쳤을 때 강제 새로고침 없이 반영되게 한다)
  web:
    resources:
      cache:
        period: 0
  devtools:
    livereload:
      enabled: true

  # ----- DataSource (개발: H2 파일 모드) -----
  # 재시작해도 데이터 유지. MySQL/PostgreSQL 전환 시 이 블록만 교체.
  datasource:
    url: jdbc:h2:file:./data/sumeun
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ----- JPA / Hibernate -----
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ----- H2 콘솔 (개발 중 데이터 확인용: /h2-console) -----
  # 배포 환경에서는 반드시 꺼야 한다(DB 전체를 웹에서 읽고 쓸 수 있게 되므로).
  # Render 등 배포 시 환경변수 H2_CONSOLE_ENABLED=false 로 끈다.
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}

  # ----- 후기 사진 업로드 (multipart) -----
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB   # 장당 10MB × 최대 5장 + 여유

server:
  port: 8080
  servlet:
    session:
      # 세션 id 를 URL(;jsessionid=)에 붙이지 않는다.
      # 후기 공유 링크를 복사·전달할 때 세션이 함께 새어나가는 것을 막는다.
      tracking-modes: cookie

# ----- 업로드 저장소 (LocalImageStorage / WebConfig) -----
# S3 등으로 옮길 때는 ImageStorage 구현만 교체하면 된다.
app:
  upload:
    dir: ./uploads          # 실제 파일이 저장되는 디렉터리 (gitignore 대상)
    url-prefix: /uploads    # 웹에서 접근하는 경로



# ----- 카카오맵 -----
# 코스 동선 표시와 길찾기에 쓴다. JavaScript 키는 커밋하지 않는다.
# ./config/application-secret.yaml 에 아래처럼 넣는다:
#   kakao:
#     js:
#       key: 발급받은_JavaScript_키
# (developers.kakao.com → 앱 생성 → JavaScript 키.
#  플랫폼 > Web 에 http://localhost:8080 을 등록해야 지도가 뜬다)
#
# 실제 도로 경로·소요시간·거리는 카카오모빌리티 길찾기를 쓴다.
# 지도용 JavaScript 키와 다른 REST API 키가 필요하다(같은 앱에서 발급):
#   kakao:
#     mobility:
#       rest-api-key: 발급받은_REST_API_키
kakao:
  mobility:
    daily-call-limit: 300   # 경로는 코스당 1회만 계산해 저장하므로 넉넉하다

# ----- AI 여행 상담(Gemini) -----
# 키는 커밋하지 않는다. ./config/application-secret.yaml 에 gemini.api.key 를 넣는다.
gemini:
  api:
    # 무료 등급에서 동작하는 모델.
    # 특정 버전(gemini-2.5-flash-lite 등)은 신규 사용자에게 막히는 일이 있어
    # 항상 최신을 가리키는 별칭을 쓴다. 사용 가능한 모델이 바뀌면 여기만 수정.
    model: gemini-flash-lite-latest
    timeout-seconds: 30

# ----- 관광지 상세 설명 선적재 배치 -----
# 상세 설명은 개인화 발견 엔진(임베딩·합성 질의·파인튜닝)의 재료다 — PRD §13-4 임계 경로.
# 콘텐츠 1건당 호출 2회가 들고 1일 한도가 950이라 하루로는 못 채운다.
# 매일 04:00(KST)에 남는 예산만큼 조금씩 채우고, 다 채우면 알아서 멈춘다.
#
#   (950 − 100) ÷ 2 ≈ 하루 425건  →  약 16일 소요
#
# 수동 실행:  POST /admin/sync/tour/details
# 진행률:     GET  /admin/sync/tour/details/progress
tour:
  api:
    backfill:
      enabled: true             # false 로 두면 야간 자동 실행만 멈춘다(수동 실행은 가능)
      cron: "0 0 4 * * *"       # KST
      reserve-for-users: 100    # 낮에 사용자가 '자세히'를 펼칠 몫. 배치가 다 먹지 않게 남긴다

# tour.api.key 는 커밋하지 않는다(공개 저장소 노출 방지).
# 주입 방법(둘 중 하나):
#   1) 환경변수 TOUR_API_KEY=... (relaxed binding → tour.api.key)
#   2) ./config/application-secret.yaml (gitignore됨) — 아래 spring.config.import 로 로드

# ----- 관리자 API 토큰 (AdminTokenFilter) -----
# /admin/** 호출 시 X-Admin-Token 헤더로 이 값을 보내야 한다.
# 비어 있으면(로컬 기본값) 검사를 건너뛴다 — 배포 환경은 반드시 채워야 실효성이 있다.
# 주입 방법: 환경변수 ADMIN_TOKEN=... (relaxed binding → admin.token)
#           또는 ./config/application-secret.yaml 에 admin.token 추가
admin:
  token: ""